services:
  bunkerkartet:
    image: ${IMAGE_REPOSITORY:-ghcr.io/reedtrullz/bunkerkartet}@${IMAGE_DIGEST:?set IMAGE_DIGEST to the published sha256 digest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BUNKERKARTET_DATA_DIR: /app/data
      APP_VERSION: ${APP_VERSION:?set APP_VERSION to the deployed commit SHA}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - bunkerkartet-data:/app/data

volumes:
  bunkerkartet-data:
    name: bunkerkartet-data
