name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Create virtualenv
        run: python -m venv .venv
      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Record resolved Python dependencies
        run: |
          .venv/bin/python -m pip freeze --all | sort > .venv/dependency-resolution.txt
          {
            echo "### Python 3.12 dependency resolution"
            echo "Commit: $GITHUB_SHA"
            echo "Receipt SHA256: $(sha256sum .venv/dependency-resolution.txt | cut -d ' ' -f 1)"
            echo '```text'
            cat .venv/dependency-resolution.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install browser runtime
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Test
        run: .venv/bin/python -m pytest -q --ignore=tests/test_browser_smoke.py
      - name: Browser smoke
        run: .venv/bin/python -m pytest -q tests/test_browser_smoke.py
      - name: Validate frontend syntax
        run: |
          node --check app/static/app.js
          node --check app/static/research-ui.js
          node --check app/static/workflow-ui.js
          node --check app/static/offline-notebook.js
      - name: Build image
        run: docker build --tag bunkerkartet:ci .

      - name: Smoke test non-root container readiness
        env:
          BUNKERKARTET_SMOKE_IMAGE: bunkerkartet:ci
        run: .venv/bin/python -m pytest -q tests/test_container_smoke.py

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: publish
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Record published digest
        run: |
          echo "Published image: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
