---
- name: Prepare Bunkerkartet
  hosts: all
  become: true
  vars:
    app_dir: "{{ bunkerkartet_app_dir | default('/opt/bunkerkartet') }}"
  tasks:
    - name: Validate release coordinates
      ansible.builtin.assert:
        that:
          - bunkerkartet_image_tag is match('^[0-9a-f]{40}$')
          - bunkerkartet_image_digest is match('^sha256:[0-9a-f]{64}$')
          - bunkerkartet_registry_username is defined
          - bunkerkartet_registry_token is defined
        fail_msg: "Provide a 40-character commit SHA, published image digest, and GHCR credentials outside Git."

    - name: Log in to GHCR
      ansible.builtin.command:
        cmd: docker login ghcr.io --username "{{ bunkerkartet_registry_username }}" --password-stdin
        stdin: "{{ bunkerkartet_registry_token }}"
      no_log: true
      changed_when: true

    - name: Pull the requested image tag
      ansible.builtin.command:
        cmd: docker pull "{{ bunkerkartet_image_repository }}:{{ bunkerkartet_image_tag }}"
      register: image_pull
      changed_when: "'Downloaded newer image' in image_pull.stdout or 'Pull complete' in image_pull.stdout"

    - name: Inspect the pulled image
      ansible.builtin.command:
        cmd: docker image inspect "{{ bunkerkartet_image_repository }}:{{ bunkerkartet_image_tag }}"
      register: image_inspect
      changed_when: false

    - name: Read all digests from the pulled image
      ansible.builtin.set_fact:
        image_repo_digests: "{{ (image_inspect.stdout | from_json | first).RepoDigests }}"

    - name: Assert the tag resolves to the expected digest
      ansible.builtin.assert:
        that:
          - "image_repo_digests | length > 0"
          - "bunkerkartet_image_repository ~ '@' ~ bunkerkartet_image_digest in image_repo_digests"
        fail_msg: "The pulled commit tag did not resolve to the expected image digest."

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Compose definition
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Start the pinned image
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout or 'Recreated' in compose_up.stdout"

    - name: Verify health and deployed version
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/api/health
        return_content: true
        status_code: 200
      register: health
      until: health.json.status == 'healthy' and health.json.version == bunkerkartet_image_tag
      retries: 12
      delay: 5
