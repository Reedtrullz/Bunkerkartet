---
- name: Prepare Bunkerkartet
  hosts: all
  become: true
  vars:
    app_dir: "{{ bunkerkartet_app_dir | default('/opt/bunkerkartet') }}"
    app_port: "{{ bunkerkartet_app_port | default(8000) }}"
    data_volume: "{{ bunkerkartet_data_volume | default('bunkerkartet-data') }}"
    release_dir: "{{ bunkerkartet_release_dir | default('/srv/backups/bunkerkartet-releases') }}"
  tasks:
    - name: Validate release, backup, port, and rollback coordinates
      ansible.builtin.assert:
        that:
          - bunkerkartet_image_tag is match('^[0-9a-f]{40}$')
          - bunkerkartet_image_digest is match('^sha256:[0-9a-f]{64}$')
          - (app_port | int) >= 1
          - (app_port | int) <= 65535
          - bunkerkartet_expected_schema_version is defined
          - bunkerkartet_backup_archive_path is defined
          - bunkerkartet_backup_receipt_path is defined
          - bunkerkartet_backup_sha256 is match('^[0-9a-f]{64}$')
          - bunkerkartet_backup_schema_version | int == bunkerkartet_rollback_schema_version | int
          - bunkerkartet_backup_schema_version | int <= bunkerkartet_expected_schema_version | int
          - bunkerkartet_backup_schema_version | int == bunkerkartet_expected_schema_version | int or (bunkerkartet_data_volume != bunkerkartet_rollback_data_volume and bunkerkartet_migration_qualification_path is defined)
          - bunkerkartet_rollback_image_digest is match('^sha256:[0-9a-f]{64}$')
          - bunkerkartet_rollback_schema_version | int == bunkerkartet_backup_schema_version | int
          - bunkerkartet_rollback_backup_sha256 is match('^[0-9a-f]{64}$')
          - bunkerkartet_rollback_backup_sha256 == bunkerkartet_backup_sha256
          - bunkerkartet_rollback_data_volume is defined
        fail_msg: "Release, verified backup/schema, loopback port, and rollback pair must be supplied before deployment."

    - name: Read staged migration qualification for a schema-changing release
      ansible.builtin.set_fact:
        migration_qualification: "{{ lookup('ansible.builtin.file', bunkerkartet_migration_qualification_path) | from_json }}"
      when: bunkerkartet_backup_schema_version | int != bunkerkartet_expected_schema_version | int

    - name: Validate the staged migration and preserved rollback pair before replacement
      ansible.builtin.assert:
        that:
          - migration_qualification.database_sha256 is match('^[0-9a-f]{64}$')
          - migration_qualification.database_size_bytes | int > 0
          - migration_qualification.verified | bool
          - migration_qualification.staged_only | bool
          - migration_qualification.schema_before | int == bunkerkartet_backup_schema_version | int
          - migration_qualification.schema_after | int == bunkerkartet_expected_schema_version | int
          - migration_qualification.backup_sha256 == bunkerkartet_backup_sha256
          - migration_qualification.candidate_data_volume == bunkerkartet_data_volume
          - migration_qualification.rollback_data_volume == bunkerkartet_rollback_data_volume
          - bunkerkartet_data_volume != bunkerkartet_rollback_data_volume
        fail_msg: "A schema-changing candidate must use its qualified separate volume and preserve the previous rollback pair."
      when: bunkerkartet_backup_schema_version | int != bunkerkartet_expected_schema_version | int

    - name: Inspect the existing environment file without reading its contents
      ansible.builtin.stat:
        path: "{{ app_dir }}/.env"
      register: app_env

    - name: Require a private environment file
      ansible.builtin.assert:
        that:
          - app_env.stat.exists
          - app_env.stat.isreg
          - app_env.stat.mode[2:] == '00'
          - app_env.stat.mode[1] in ['4', '5', '6', '7']
        fail_msg: "Create {{ app_dir }}/.env with owner-only access before deployment."

    - name: Require a nonempty administrator token without exposing it
      ansible.builtin.command:
        argv:
          - grep
          - -Eq
          - '^[[:space:]]*ADMIN_TOKEN=[^[:space:]#]+([[:space:]]+#.*)?$'
          - .env
        chdir: "{{ app_dir }}"
      register: admin_token_check
      changed_when: false
      no_log: true

    - name: Inspect verified backup files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ bunkerkartet_backup_archive_path }}"
        - "{{ bunkerkartet_backup_receipt_path }}"
      register: backup_files

    - name: Require both backup archive and receipt
      ansible.builtin.assert:
        that:
          - backup_files.results | length == 2
          - backup_files.results[0].stat.exists
          - backup_files.results[1].stat.exists
        fail_msg: "A retained backup archive and checksum receipt are required before replacement."

    - name: Read the archive checksum
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ bunkerkartet_backup_archive_path }}"
      register: backup_checksum
      changed_when: false

    - name: Require the reviewed backup checksum
      ansible.builtin.assert:
        that:
          - backup_checksum.stdout.split()[0] == bunkerkartet_backup_sha256
        fail_msg: "The backup archive checksum differs from the reviewed preflight value."

    - name: Pull the requested commit tag
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ bunkerkartet_image_repository }}:{{ bunkerkartet_image_tag }}"
      register: image_pull
      changed_when: "'Downloaded newer image' in image_pull.stdout or 'Pull complete' in image_pull.stdout"

    - name: Inspect the pulled image
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "{{ bunkerkartet_image_repository }}:{{ bunkerkartet_image_tag }}"
      register: image_inspect
      changed_when: false

    - name: Read image repository digests
      ansible.builtin.set_fact:
        image_repo_digests: "{{ (image_inspect.stdout | from_json | first).RepoDigests }}"

    - name: Require the commit tag to resolve to the reviewed digest
      ansible.builtin.assert:
        that:
          - "image_repo_digests | length > 0"
          - "bunkerkartet_image_repository ~ '@' ~ bunkerkartet_image_digest in image_repo_digests"
        fail_msg: "The pulled commit tag did not resolve to the reviewed image digest."

    - name: Verify backup checksum, archive bounds, and database schema in the candidate image
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --read-only
          - --tmpfs
          - /tmp:rw,nosuid,noexec,size=32m
          - --user
          - "0:0"
          - --volume
          - "{{ bunkerkartet_backup_archive_path }}:/backup/{{ bunkerkartet_backup_archive_path | basename }}:ro"
          - --volume
          - "{{ bunkerkartet_backup_receipt_path }}:/backup/{{ bunkerkartet_backup_archive_path | basename }}.receipt.json:ro"
          - --entrypoint
          - python
          - "{{ bunkerkartet_image_repository }}@{{ bunkerkartet_image_digest }}"
          - /app/scripts/backup_database.py
          - verify
          - --archive
          - /backup/{{ bunkerkartet_backup_archive_path | basename }}
          - --receipt
          - /backup/{{ bunkerkartet_backup_archive_path | basename }}.receipt.json
          - --expected-schema-version
          - "{{ bunkerkartet_backup_schema_version }}"
      register: backup_verification
      changed_when: false

    - name: Bind the candidate volume bytes to the staged migration qualification before startup
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --read-only
          - --volume
          - "{{ data_volume }}:/candidate:ro"
          - --entrypoint
          - python
          - "{{ bunkerkartet_image_repository }}@{{ bunkerkartet_image_digest }}"
          - /app/scripts/verify_candidate_volume.py
          - --database
          - /candidate/bunkerkartet.sqlite3
          - --expected-sha256
          - "{{ migration_qualification.database_sha256 }}"
          - --expected-size
          - "{{ migration_qualification.database_size_bytes }}"
          - --expected-version
          - "{{ bunkerkartet_expected_schema_version }}"
      changed_when: false
      when: bunkerkartet_backup_schema_version | int != bunkerkartet_expected_schema_version | int

    - name: Ensure release receipt directory exists
      ansible.builtin.file:
        path: "{{ release_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create the managed app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install digest-pinned Compose definition
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Start the verified image on the selected loopback port and data volume
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - up
          - -d
          - --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout or 'Recreated' in compose_up.stdout"

    - name: Require exact-version private application readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/api/ready"
        return_content: true
        status_code: 200
      register: readiness
      until: >-
        (readiness.json | default({})).get('status') == 'ready'
        and (readiness.json | default({})).get('database') == 'ready'
        and (readiness.json | default({})).get('authentication') == 'configured'
      retries: 12
      delay: 5

    - name: Require the deployed API version to equal the full commit SHA
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/api/version"
        return_content: true
        status_code: 200
      register: deployed_version
      until: (deployed_version.json | default({})).get('version') == bunkerkartet_image_tag
      retries: 12
      delay: 5

    - name: Save redacted readiness receipt input
      ansible.builtin.copy:
        content: "{{ readiness.json | to_nice_json }}\n"
        dest: "{{ release_dir }}/.{{ bunkerkartet_image_tag }}-readiness.json"
        owner: root
        group: root
        mode: "0600"

    - name: Save exact version receipt input
      ansible.builtin.copy:
        content: "{{ deployed_version.json | to_nice_json }}\n"
        dest: "{{ release_dir }}/.{{ bunkerkartet_image_tag }}-version.json"
        owner: root
        group: root
        mode: "0600"

    - name: Retain the reviewed staged migration qualification
      ansible.builtin.copy:
        src: "{{ bunkerkartet_migration_qualification_path }}"
        dest: "{{ release_dir }}/.{{ bunkerkartet_image_tag }}-migration.json"
        owner: root
        group: root
        mode: "0600"
      when: bunkerkartet_backup_schema_version | int != bunkerkartet_expected_schema_version | int

    - name: Build the verified release and rollback receipt
      vars:
        release_receipt_arguments:
          - docker
          - run
          - --rm
          - --read-only
          - --tmpfs
          - /tmp:rw,nosuid,noexec,size=32m
          - --user
          - "0:0"
          - --volume
          - "{{ bunkerkartet_backup_archive_path }}:/backup/{{ bunkerkartet_backup_archive_path | basename }}:ro"
          - --volume
          - "{{ bunkerkartet_backup_receipt_path }}:/backup/{{ bunkerkartet_backup_archive_path | basename }}.receipt.json:ro"
          - --volume
          - "{{ release_dir }}:/receipts"
          - --entrypoint
          - python
          - "{{ bunkerkartet_image_repository }}@{{ bunkerkartet_image_digest }}"
          - /app/scripts/release_receipt.py
          - build
          - --commit-sha
          - "{{ bunkerkartet_image_tag }}"
          - --image-digest
          - "{{ bunkerkartet_image_digest }}"
          - --database-schema-version
          - "{{ bunkerkartet_expected_schema_version }}"
          - --backup-archive
          - /backup/{{ bunkerkartet_backup_archive_path | basename }}
          - --backup-receipt
          - /backup/{{ bunkerkartet_backup_archive_path | basename }}.receipt.json
          - --selected-port
          - "{{ app_port }}"
          - --readiness-json
          - "/receipts/.{{ bunkerkartet_image_tag }}-readiness.json"
          - --version-json
          - "/receipts/.{{ bunkerkartet_image_tag }}-version.json"
          - --rollback-image-digest
          - "{{ bunkerkartet_rollback_image_digest }}"
          - --rollback-schema-version
          - "{{ bunkerkartet_rollback_schema_version }}"
          - --rollback-data-volume
          - "{{ bunkerkartet_rollback_data_volume }}"
          - --rollback-backup-sha256
          - "{{ bunkerkartet_rollback_backup_sha256 }}"
          - --output
          - "/receipts/{{ bunkerkartet_image_tag }}.json"
      ansible.builtin.command:
        argv: "{{ release_receipt_arguments + (['--migration-qualification', '/receipts/.' ~ bunkerkartet_image_tag ~ '-migration.json'] if bunkerkartet_backup_schema_version | int != bunkerkartet_expected_schema_version | int else []) }}"
      register: release_receipt
      changed_when: true

    - name: Remove temporary receipt input files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ release_dir }}/.{{ bunkerkartet_image_tag }}-readiness.json"
        - "{{ release_dir }}/.{{ bunkerkartet_image_tag }}-version.json"

    - name: Validate the persisted redacted release receipt
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --read-only
          - --user
          - "0:0"
          - --volume
          - "{{ release_dir }}/{{ bunkerkartet_image_tag }}.json:/receipt.json:ro"
          - --entrypoint
          - python
          - "{{ bunkerkartet_image_repository }}@{{ bunkerkartet_image_digest }}"
          - /app/scripts/release_receipt.py
          - verify
          - /receipt.json
      changed_when: false
